// Mini generador de PDF propio (sin librerías). Factura Fácil.
(function(){
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const BW=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const MAP={'€':128,'‚':130,'„':132,'…':133,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'−':45,' ':32,' ':32};
function enc(s){let o='';for(const ch of String(s)){const c=ch.charCodeAt(0);if(MAP[ch]!==undefined)o+=String.fromCharCode(MAP[ch]);else if(c<256)o+=ch;else{const b=ch.normalize('NFD')[0];o+=b.charCodeAt(0)<256?b:'?'}}return o}
function wch(code,bold){const t=bold?BW:HW;if(code>=32&&code<=126)return t[code-32];if(code===128)return 556;if(code===160)return 278;if(code===186||code===170)return 365;if(code===183)return 278;
  const b=String.fromCharCode(code).normalize('NFD')[0].charCodeAt(0);return b>=32&&b<=126?t[b-32]:556}
function width(s,size,bold){const e=enc(s);let w=0;for(let i=0;i<e.length;i++)w+=wch(e.charCodeAt(i),bold);return w*size/1000}
function esc(e){return e.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function wrap(s,size,bold,max){const out=[];String(s||'').split('\n').forEach(par=>{let line='';par.split(/\s+/).filter(Boolean).forEach(w=>{const t=line?line+' '+w:w;if(width(t,size,bold)<=max||!line)line=t;else{out.push(line);line=w}});out.push(line)});return out}
function Doc(){const H=841.89;let c='';const col=(r,g,b)=>(r/255).toFixed(3)+' '+(g/255).toFixed(3)+' '+(b/255).toFixed(3);
  return{H,
    text(s,x,y,o={}){const size=o.size||11,bold=!!o.bold,e=enc(s);let xx=x;if(o.align==='right')xx=x-width(s,size,bold);
      c+='BT '+col(...(o.color||[20,32,28]))+' rg /'+(bold?'F2':'F1')+' '+size+' Tf '+xx.toFixed(2)+' '+(H-y).toFixed(2)+' Td ('+esc(e)+') Tj ET\n'},
    rot(s,cx,cy,size,deg,color){const a=deg*Math.PI/180,co=Math.cos(a),si=Math.sin(a),w=width(s,size,true),hh=size*0.35;
      const px=cx-(w/2*co-hh*si),py=(H-cy)-(w/2*si+hh*co);
      c+='BT '+col(...color)+' rg /F2 '+size+' Tf '+[co,si,-si,co,px,py].map(n=>n.toFixed(3)).join(' ')+' Tm ('+esc(enc(s))+') Tj ET\n'},
    line(x1,y1,x2,y2,w,color){c+=col(...color)+' RG '+w+' w '+x1.toFixed(2)+' '+(H-y1).toFixed(2)+' m '+x2.toFixed(2)+' '+(H-y2).toFixed(2)+' l S\n'},
    out(){const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
      '<< /Length '+c.length+' >>\nstream\n'+c+'endstream',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
      let s='%PDF-1.4\n%\xe2\xe3\xcf\xd3\n';const off=[];objs.forEach((o,i)=>{off.push(s.length);s+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
      const x=s.length;s+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+off.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
      const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u}}}
// F = {titulo,num,fecha,em:{nom,nif,dir},cl:{nom,nif,dir},ls:[{c,i}],tot:[[etiqueta,valor]],total,pies:[],borr}
window.facturaPDF=function(F,eur){const d=Doc(),G=[15,92,77],GR=[102,102,102],L=50,R=545;
  if(F.borr)d.rot('BORRADOR',297,421,96,30,[246,218,214]);
  d.text(F.titulo,L,82,{size:26,bold:true,color:G});let y=108;
  if(F.num){d.text('Nº '+F.num,L,y);y+=16}if(F.fecha){d.text('Fecha: '+F.fecha,L,y);y+=16}
  y+=26;const col=(lab,p,x)=>{let yy=y;d.text(lab,x,yy,{size:8,color:GR});yy+=16;
    if(p.nom){wrap(p.nom,11,true,225).forEach(t=>{d.text(t,x,yy,{bold:true});yy+=15})}
    if(p.nif){d.text('NIF: '+p.nif,x,yy);yy+=15}
    wrap(p.dir,11,false,225).forEach(t=>{if(t){d.text(t,x,yy);yy+=15}});return yy};
  y=Math.max(col('EMISOR',F.em,L),col('CLIENTE',F.cl,310))+22;
  d.text('CONCEPTO',L,y,{size:8,bold:true,color:GR});d.text('IMPORTE',R,y,{size:8,bold:true,color:GR,align:'right'});
  y+=7;d.line(L,y,R,y,1.5,G);y+=18;
  F.ls.forEach(l=>{const lines=wrap(l.c,11,false,370);lines.forEach((t,k)=>{d.text(t,L,y+k*15)});d.text(eur(l.i),R,y,{align:'right'});y+=lines.length*15+4;d.line(L,y-8,R,y-8,.5,[221,221,221]);y+=8});
  y+=8;const TX=300;F.tot.forEach(([a,b])=>{d.text(a,TX,y);d.text(b,R,y,{align:'right'});y+=19});
  y+=2;d.line(TX,y-8,R,y-8,1.5,G);y+=12;d.text('Total',TX,y,{size:15,bold:true});d.text(F.total,R,y,{size:15,bold:true,align:'right'});
  y+=36;(F.pies||[]).forEach(p=>{wrap(p,10,false,R-L).forEach(t=>{d.text(t,L,y,{size:10,color:[68,68,68]});y+=14});y+=4});
  return new Blob([d.out()],{type:'application/pdf'})};
})();

<script>
const $=id=>document.getElementById(id);
let modo='base',iva=21,irpf=15,cli='emp';
const IR=()=>cli==='part'?0:irpf;
const eur=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const pf=v=>String(v).replace('.',',');
const r2=n=>Math.round(n*100)/100;
// Lee importes: "12,50", "12.50", "1.250", "1.250,50" y "1250"
function aNum(v){let s=String(v||'').replace(/[\s€]/g,'');
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isNaN(n)?0:n}
function leer(){return aNum($('imp').value)}
function calc(){
  const x=leer();
  const base=modo==='base'?x:x/(1+iva/100-IR()/100);
  const b=r2(base),i=r2(b*iva/100),p=r2(b*IR()/100),t=r2(b+i-p);
  $('oBase').textContent=eur(b);$('oIva').textContent=eur(i);$('oIrpf').textContent=eur(p);$('oTot').textContent=eur(t);
  $('tIva').textContent=iva?'+ IVA '+pf(iva)+' %':'Sin IVA';
  $('tIrpf').textContent=irpf?'− IRPF '+pf(irpf)+' %':'Sin IRPF';
  $('filaIrpf').hidden=$('rIrpf').hidden=cli==='part';
  try{localStorage.setItem('ff',JSON.stringify({iva,irpf,modo,cli}))}catch(e){}
  if($('exWrap'))$('exWrap').hidden=iva!==0;
  return {b,i,p,t};
}
const pct=v=>{const n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?0:Math.min(Math.max(n,0),100)};
function chips(id,set){const inp=$(id+'Otro');
  $(id).querySelectorAll('button').forEach(btn=>btn.onclick=()=>{$(id).querySelectorAll('button').forEach(o=>o.classList.remove('on'));btn.classList.add('on');
    if(btn.dataset.v==='otro'){inp.hidden=false;inp.focus();set(pct(inp.value))}else{inp.hidden=true;set(+btn.dataset.v)}calc()});
  inp.oninput=()=>{set(pct(inp.value));calc()}}
function marcar(id,v){let ok=false;$(id).querySelectorAll('button').forEach(b=>{const m=b.dataset.v!=='otro'&&+b.dataset.v===v;b.classList.toggle('on',m);if(m)ok=true});
  if(!ok){$(id).querySelector('[data-v="otro"]').classList.add('on');$(id+'Otro').hidden=false;$(id+'Otro').value=String(v).replace('.',',')}}
chips('iva',v=>iva=v);chips('irpf',v=>irpf=v);
function setModo(m){modo=m;$('mBase').classList.toggle('on',m==='base');$('mTotal').classList.toggle('on',m!=='base');$('lbl').textContent=m==='base'?'¿Cuánto cobras por el trabajo? (sin impuestos)':'¿Cuánto quieres que te llegue?';calc()}
function setCli(c){cli=c;$('cli').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));calc()}
$('cli').querySelectorAll('button').forEach(b=>b.onclick=()=>setCli(b.dataset.c));
$('mBase').onclick=()=>setModo('base');$('mTotal').onclick=()=>setModo('total');
$('imp').oninput=calc;
try{const g=JSON.parse(localStorage.getItem('ff')||'{}');
  if(g.iva!=null){iva=g.iva;marcar('iva',iva)}
  if(g.irpf!=null){irpf=g.irpf;marcar('irpf',irpf)}
  if(g.cli)setCli(g.cli);
  if(g.modo)setModo(g.modo)}catch(e){}
calc();$('imp').focus();

// ---- Factura ----
const num=aNum;
const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E=['eNom','eNif','eDir','eIban','fExento'];
function linea(c='',i=''){const d=document.createElement('div');d.className='lin';
  d.innerHTML='<input placeholder="Concepto"><input class="im" inputmode="decimal" placeholder="0,00 €"><button class="x" aria-label="Quitar">✕</button>';
  d.children[0].value=c;d.children[1].value=i;d.children[2].onclick=()=>{d.remove();if(!$('lineas').children.length)linea()};
  $('lineas').appendChild(d)}
$('masLin').onclick=()=>linea();
$('abrirFac').onclick=()=>{
  try{const g=JSON.parse(localStorage.getItem('ffe')||'{}');E.forEach(k=>{if(g[k]&&!$(k).value)$(k).value=g[k]})}catch(e){}
  if(!$('fFecha').value){const d=new Date();$('fFecha').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  if(!$('lineas').children.length){const b=calc().b;linea('',b?b.toFixed(2).replace('.',','):'')}
  $('fac').classList.add('on');$('fac').scrollIntoView({behavior:'smooth'})};
$('cerrarFac').onclick=()=>{$('fac').classList.remove('on');window.scrollTo({top:0,behavior:'smooth'})};
$('imprimir').onclick=()=>{
  const g={};E.forEach(k=>g[k]=$(k).value.trim());try{localStorage.setItem('ffe',JSON.stringify(g))}catch(e){}
  const ls=[...$('lineas').children].map(d=>({c:d.children[0].value.trim(),i:num(d.children[1].value)})).filter(l=>l.c||l.i);
  const b=r2(ls.reduce((a,l)=>a+l.i,0)),i=r2(b*iva/100),p=r2(b*IR()/100),t=r2(b+i-p);
  const f=$('fFecha').value?new Date($('fFecha').value+'T12:00').toLocaleDateString('es-ES'):'';
  const br=s=>esc(s).replace(/\n/g,'<br>');
  const v=id=>$(id).value.trim(), emp=cli!=='part', falta=[];
  if(!v('fNum'))falta.push('número de factura');
  if(!v('fFecha'))falta.push('fecha');
  if(!g.eNom)falta.push('tu nombre o empresa');
  if(!g.eNif)falta.push('tu NIF');
  if(!g.eDir)falta.push('tu dirección');
  if(!v('cNom'))falta.push('nombre del cliente');
  if(emp&&!v('cNif'))falta.push('NIF del cliente');
  if(emp&&!v('cDir'))falta.push('dirección del cliente');
  if(!ls.some(l=>l.c&&l.i))falta.push('concepto con su importe');
  if(iva===0&&!g.fExento)falta.push('motivo de no llevar IVA');
  const borr=falta.length>0;
  $('falta').hidden=!borr;
  $('falta').innerHTML=borr?'<b>Borrador: '+(falta.length>1?'faltan '+falta.length+' datos':'falta 1 dato')+'</b>'+esc(falta.join(', '))+'.':'';
  $('hoja').innerHTML=(borr?'<div class="marca" aria-hidden="true"><span>BORRADOR</span></div>':'')+`<div class="cab"><div><h1>${borr?'Borrador de factura':'Factura'}</h1>${$('fNum').value?'Nº '+esc($('fNum').value):''}${f?'<br>Fecha: '+f:''}</div></div>
  <div class="cab"><div class="caja"><small>Emisor</small><b>${esc(g.eNom)}</b><br>${g.eNif?'NIF: '+esc(g.eNif)+'<br>':''}${br(g.eDir)}</div>
  <div class="caja"><small>Cliente</small><b>${esc($('cNom').value)}</b><br>${$('cNif').value?'NIF: '+esc($('cNif').value)+'<br>':''}${br($('cDir').value)}</div></div>
  <table><tr><th>Concepto</th><th class="d">Importe</th></tr>${ls.map(l=>`<tr><td>${esc(l.c)}</td><td class="d">${eur(l.i)}</td></tr>`).join('')}</table>
  <div class="tot"><div><span>Base imponible</span><span>${eur(b)}</span></div>
  <div><span>${iva?'IVA '+pf(iva)+' %':'IVA (exento)'}</span><span>${eur(i)}</span></div>
  ${IR()?`<div><span>Retención IRPF ${pf(irpf)} %</span><span>−${eur(p)}</span></div>`:''}
  <div class="g"><span>Total</span><span>${eur(t)}</span></div></div>
  ${iva===0&&g.fExento?`<div class="pie">${esc(g.fExento)}</div>`:''}
  ${g.eIban?`<div class="pie">Forma de pago: transferencia a ${esc(g.eIban)}</div>`:''}`;
  ls_('ffN',(+ls_('ffN')||0)+1);FAC={titulo:borr?'Borrador de factura':'Factura',num:v('fNum'),fecha:f,borr,
    em:{nom:g.eNom,nif:g.eNif,dir:g.eDir},cl:{nom:v('cNom'),nif:v('cNif'),dir:v('cDir')},ls,
    tot:[['Base imponible',eur(b)],[iva?'IVA '+pf(iva)+' %':'IVA (exento)',eur(i)]].concat(IR()?[['Retención IRPF '+pf(irpf)+' %','-'+eur(p)]]:[]),
    total:eur(t),pies:[iva===0&&g.fExento?g.fExento:'',g.eIban?'Forma de pago: transferencia a '+g.eIban:''].filter(Boolean)};
  $('vista').classList.add('on');$('vista').scrollTop=0;document.body.style.overflow='hidden'};
// ---- Valorar (solo en Windows, tras 3 facturas) ----
const ls_=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
function verValora(){if(/Windows/.test(navigator.userAgent)&&!ls_('ffValora')&&(+ls_('ffN')||0)>=3)$('valora').hidden=false}
$('valoraNo').onclick=()=>{$('valora').hidden=true;ls_('ffValora','no')};
$('valoraSi').onclick=()=>{$('valora').hidden=true;ls_('ffValora','si')};
verValora();
$('cerrarVista').onclick=()=>{$('vista').classList.remove('on');document.body.style.overflow='';verValora()};
let FAC=null;
const MOVIL=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
$('imprimir2').onclick=()=>{const tt=document.title;document.title=($('falta').hidden?'Factura ':'Borrador factura ')+($('fNum').value||'');window.print();setTimeout(()=>document.title=tt,1000)};
$('enviar').onclick=async()=>{if(!FAC)return;
  const name=((FAC.borr?'Borrador factura ':'Factura ')+(FAC.num||'')).trim().replace(/[\\/:*?"<>|]/g,'-')+'.pdf';
  const blob=facturaPDF(FAC,eur);
  let file=null;try{file=new File([blob],name,{type:'application/pdf'})}catch(e){}
  if(MOVIL&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
