<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factura Fácil · Calculadora de IVA e IRPF</title>
<meta name="description" content="Calcula al momento el IVA, el IRPF y el total de tus facturas de autónomo. Gratis, en español y sin internet.">
<meta name="theme-color" content="#0F5C4D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F4F6F5;--card:#fff;--txt:#14201C;--sub:#5B6B65;--line:#E2E8E5;--acc:#0F5C4D;--acc2:#E7F2EF;--neg:#B3412E}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1C2421;--txt:#EEF3F1;--sub:#9DAEA7;--line:#2C3833;--acc:#3FB896;--acc2:#1F332D;--neg:#F08A76}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:17px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 32px;display:flex;justify-content:center}
main{width:100%;max-width:440px}
h1{font-size:22px;margin:4px 0 16px;display:flex;align-items:center;gap:10px}
h1 img{width:34px;height:34px;border-radius:9px}
.card{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--line);margin-bottom:14px}
.modo{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px}
.modo button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:15px;padding:9px;border-radius:9px;cursor:pointer}
.modo button.on{background:var(--card);color:var(--txt);font-weight:600;box-shadow:0 1px 3px #0002}
label{display:block;font-size:14px;color:var(--sub);margin-bottom:6px}
.imp{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;padding:0 14px}
.imp:focus-within{border-color:var(--acc)}
.imp input{flex:1;border:0;background:none;color:var(--txt);font:600 30px system-ui,-apple-system,"Segoe UI",sans-serif;padding:10px 0;width:100%;outline:0}
.imp span{font-size:24px;color:var(--sub)}
.fila{margin-top:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:15px;padding:8px 14px;border-radius:20px;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.otro{width:100%;margin-top:10px;border:2px solid var(--acc);background:var(--bg);color:var(--txt);font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif;padding:10px 12px;border-radius:12px;outline:0}
.r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.r:last-child{border:0}
.r b{font-variant-numeric:tabular-nums}
.r.neg b{color:var(--neg)}
.total{background:var(--acc2);border-radius:14px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.total span{font-weight:600}
.total b{font-size:28px;color:var(--acc);font-variant-numeric:tabular-nums}
.copiar{width:100%;margin-top:12px;border:0;background:var(--acc);color:#fff;font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;padding:13px;border-radius:12px;cursor:pointer}
footer{text-align:center;font-size:14px;color:var(--sub);margin-top:6px}
footer a{color:var(--sub)}
.btn2{width:100%;margin-top:10px;border:2px solid var(--acc);background:none;color:var(--acc);font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;padding:11px;border-radius:12px;cursor:pointer}
#fac{display:none}#fac.on{display:block}
.fac h2{font-size:18px;margin:4px 0 12px}
.fac h3{font-size:15px;color:var(--sub);margin:16px 0 8px;font-weight:600}
.fac input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--txt);font:16px system-ui,-apple-system,"Segoe UI",sans-serif;padding:10px 12px;border-radius:10px;margin-bottom:8px;outline:0}
.fac input:focus{border-color:var(--acc)}
.dos{display:flex;gap:8px}.dos input{flex:1;min-width:0}
.lin{display:flex;gap:8px;align-items:center}.lin input:first-child{flex:1;min-width:0}.lin input.im{width:110px;flex:none;text-align:right}
.lin .x{border:0;background:none;color:var(--sub);font-size:20px;padding:0 4px 8px;cursor:pointer}
.mas{border:0;background:none;color:var(--acc);font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;padding:4px 0;cursor:pointer}
.cerrar{float:right;border:0;background:none;color:var(--sub);font-size:24px;line-height:1;cursor:pointer}
#hoja{display:none}
@media print{body{background:#fff;color:#000;padding:0;display:block}main{display:none}#hoja{display:block}}
#hoja{font:12pt/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#000;padding:16mm;max-width:190mm;margin:0 auto}
#hoja h1{font-size:26pt;color:#0F5C4D;margin:0 0 4px}
#hoja .cab{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}
#hoja .caja{flex:1}#hoja .caja small{display:block;color:#666;font-size:9pt;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
#hoja table{width:100%;border-collapse:collapse;margin:14px 0}
#hoja th{text-align:left;font-size:9pt;color:#666;text-transform:uppercase;border-bottom:2px solid #0F5C4D;padding:6px 0}
#hoja td{padding:8px 0;border-bottom:1px solid #ddd}#hoja .d{text-align:right}
#hoja .tot{margin-left:auto;width:60%;min-width:280px}#hoja .tot span:last-child,#hoja .d{white-space:nowrap}#hoja .tot span:first-child{padding-right:12px}#hoja .tot div{display:flex;justify-content:space-between;padding:4px 0}
#hoja .tot .g{border-top:2px solid #0F5C4D;margin-top:6px;padding-top:8px;font-size:15pt;font-weight:700}
#hoja .pie{margin-top:26px;font-size:10pt;color:#444}
</style>
</head>
<body>
<main>
<h1><img src="icon-192.png" alt="">Factura Fácil</h1>

<div class="card">
  <div class="modo">
    <button id="mBase" class="on">Sé la base</button>
    <button id="mTotal">Sé lo que cobro</button>
  </div>
  <label id="lbl">Importe sin impuestos</label>
  <div class="imp"><input id="imp" inputmode="decimal" placeholder="0" autocomplete="off"><span>€</span></div>

  <div class="fila"><label>IVA</label>
    <div class="chips" id="iva"><button data-v="21" class="on">21 %</button><button data-v="10">10 %</button><button data-v="4">4 %</button><button data-v="0">Sin IVA</button><button data-v="otro">Otro</button></div>
    <input class="otro" id="ivaOtro" inputmode="decimal" placeholder="Escribe el % de IVA" hidden>
  </div>
  <div class="fila"><label>Retención IRPF</label>
    <div class="chips" id="irpf"><button data-v="15" class="on">15 %</button><button data-v="7">7 % (nuevo)</button><button data-v="0">Sin IRPF</button><button data-v="otro">Otro</button></div>
    <input class="otro" id="irpfOtro" inputmode="decimal" placeholder="Escribe el % de IRPF" hidden>
  </div>
</div>

<div class="card">
  <div class="r"><span>Base</span><b id="oBase">0,00 €</b></div>
  <div class="r"><span id="tIva">+ IVA 21 %</span><b id="oIva">0,00 €</b></div>
  <div class="r neg"><span id="tIrpf">− IRPF 15 %</span><b id="oIrpf">0,00 €</b></div>
  <div class="total"><span>Total factura</span><b id="oTot">0,00 €</b></div>
  <button class="copiar" id="copiar">Copiar resultado</button>
  <button class="btn2" id="abrirFac">🧾 Hacer factura</button>
</div>

<div class="card fac" id="fac">
  <button class="cerrar" id="cerrarFac" aria-label="Cerrar">✕</button>
  <h2>Factura</h2>
  <div class="dos"><input id="fNum" placeholder="Nº factura (ej. 2026-001)"><input id="fFecha" type="date"></div>
  <h3>Tus datos</h3>
  <input id="eNom" placeholder="Nombre o empresa" autocomplete="name">
  <input id="eNif" placeholder="NIF">
  <input id="eDir" placeholder="Dirección">
  <input id="eIban" placeholder="IBAN para el pago (opcional)">
  <h3>Cliente</h3>
  <input id="cNom" placeholder="Nombre o empresa">
  <input id="cNif" placeholder="NIF">
  <input id="cDir" placeholder="Dirección">
  <h3>Conceptos (sin impuestos)</h3>
  <div id="lineas"></div>
  <button class="mas" id="masLin">＋ Añadir línea</button>
  <button class="copiar" id="imprimir">🖨️ Imprimir / Guardar PDF</button>
</div>

<footer><a href="privacidad.html">Privacidad</a></footer>
</main>
<div id="hoja"></div>
<script>
const $=id=>document.getElementById(id);
let modo='base',iva=21,irpf=15;
const eur=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const pf=v=>String(v).replace('.',',');
const r2=n=>Math.round(n*100)/100;
function leer(){const v=parseFloat(($('imp').value||'').replace(/\./g,'').replace(',','.'));return isNaN(v)?0:v}
function calc(){
  const x=leer();
  const base=modo==='base'?x:x/(1+iva/100-irpf/100);
  const b=r2(base),i=r2(b*iva/100),p=r2(b*irpf/100),t=r2(b+i-p);
  $('oBase').textContent=eur(b);$('oIva').textContent=eur(i);$('oIrpf').textContent=eur(p);$('oTot').textContent=eur(t);
  $('tIva').textContent=iva?'+ IVA '+pf(iva)+' %':'Sin IVA';
  $('tIrpf').textContent=irpf?'− IRPF '+pf(irpf)+' %':'Sin IRPF';
  try{localStorage.setItem('ff',JSON.stringify({iva,irpf,modo}))}catch(e){}
  return {b,i,p,t};
}
const pct=v=>{const n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?0:Math.min(Math.max(n,0),100)};
function chips(id,set){const inp=$(id+'Otro');
  $(id).querySelectorAll('button').forEach(btn=>btn.onclick=()=>{$(id).querySelectorAll('button').forEach(o=>o.classList.remove('on'));btn.classList.add('on');
    if(btn.dataset.v==='otro'){inp.hidden=false;inp.focus();set(pct(inp.value))}else{inp.hidden=true;set(+btn.dataset.v)}calc()});
  inp.oninput=()=>{set(pct(inp.value));calc()}}
function marcar(id,v){let ok=false;$(id).querySelectorAll('button').forEach(b=>{const m=b.dataset.v!=='otro'&&+b.dataset.v===v;b.classList.toggle('on',m);if(m)ok=true});
  if(!ok){$(id).querySelector('[data-v="otro"]').classList.add('on');$(id+'Otro').hidden=false;$(id+'Otro').value=String(v).replace('.',',')}}
chips('iva',v=>iva=v);chips('irpf',v=>irpf=v);
function setModo(m){modo=m;$('mBase').classList.toggle('on',m==='base');$('mTotal').classList.toggle('on',m!=='base');$('lbl').textContent=m==='base'?'Importe sin impuestos':'Lo que quieres cobrar (total)';calc()}
$('mBase').onclick=()=>setModo('base');$('mTotal').onclick=()=>setModo('total');
$('imp').oninput=calc;
$('copiar').onclick=()=>{const o=calc();const txt=`Base: ${eur(o.b)}\n${$('tIva').textContent}: ${eur(o.i)}\n${$('tIrpf').textContent}: ${eur(o.p)}\nTotal: ${eur(o.t)}`;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{$('copiar').textContent='✓ Copiado';setTimeout(()=>$('copiar').textContent='Copiar resultado',1500)}).catch(()=>{})};
try{const g=JSON.parse(localStorage.getItem('ff')||'{}');
  if(g.iva!=null){iva=g.iva;marcar('iva',iva)}
  if(g.irpf!=null){irpf=g.irpf;marcar('irpf',irpf)}
  if(g.modo)setModo(g.modo)}catch(e){}
calc();$('imp').focus();

// ---- Factura ----
const num=v=>{const n=parseFloat(String(v||'').replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n};
const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E=['eNom','eNif','eDir','eIban'];
function linea(c='',i=''){const d=document.createElement('div');d.className='lin';
  d.innerHTML='<input placeholder="Concepto"><input class="im" inputmode="decimal" placeholder="0,00 €"><button class="x" aria-label="Quitar">✕</button>';
  d.children[0].value=c;d.children[1].value=i;d.children[2].onclick=()=>{d.remove();if(!$('lineas').children.length)linea()};
  $('lineas').appendChild(d)}
$('masLin').onclick=()=>linea();
$('abrirFac').onclick=()=>{
  try{const g=JSON.parse(localStorage.getItem('ffe')||'{}');E.forEach(k=>{if(g[k]&&!$(k).value)$(k).value=g[k]})}catch(e){}
  if(!$('fFecha').value){const d=new Date();$('fFecha').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  if(!$('lineas').children.length){const b=calc().b;linea('',b?b.toFixed(2).replace('.',','):'')}
  $('fac').classList.add('on');$('fac').scrollIntoView({behavior:'smooth'})};
$('cerrarFac').onclick=()=>{$('fac').classList.remove('on');window.scrollTo({top:0,behavior:'smooth'})};
$('imprimir').onclick=()=>{
  const g={};E.forEach(k=>g[k]=$(k).value.trim());try{localStorage.setItem('ffe',JSON.stringify(g))}catch(e){}
  const ls=[...$('lineas').children].map(d=>({c:d.children[0].value.trim(),i:num(d.children[1].value)})).filter(l=>l.c||l.i);
  const b=r2(ls.reduce((a,l)=>a+l.i,0)),i=r2(b*iva/100),p=r2(b*irpf/100),t=r2(b+i-p);
  const f=$('fFecha').value?new Date($('fFecha').value+'T12:00').toLocaleDateString('es-ES'):'';
  const br=s=>esc(s).replace(/\n/g,'<br>');
  $('hoja').innerHTML=`<div class="cab"><div><h1>Factura</h1>${$('fNum').value?'Nº '+esc($('fNum').value):''}${f?'<br>Fecha: '+f:''}</div></div>
  <div class="cab"><div class="caja"><small>Emisor</small><b>${esc(g.eNom)}</b><br>${g.eNif?'NIF: '+esc(g.eNif)+'<br>':''}${br(g.eDir)}</div>
  <div class="caja"><small>Cliente</small><b>${esc($('cNom').value)}</b><br>${$('cNif').value?'NIF: '+esc($('cNif').value)+'<br>':''}${br($('cDir').value)}</div></div>
  <table><tr><th>Concepto</th><th class="d">Importe</th></tr>${ls.map(l=>`<tr><td>${esc(l.c)}</td><td class="d">${eur(l.i)}</td></tr>`).join('')}</table>
  <div class="tot"><div><span>Base imponible</span><span>${eur(b)}</span></div>
  <div><span>${iva?'IVA '+pf(iva)+' %':'IVA (exento)'}</span><span>${eur(i)}</span></div>
  ${irpf?`<div><span>Retención IRPF ${pf(irpf)} %</span><span>−${eur(p)}</span></div>`:''}
  <div class="g"><span>Total</span><span>${eur(t)}</span></div></div>
  ${g.eIban?`<div class="pie">Forma de pago: transferencia a ${esc(g.eIban)}</div>`:''}`;
  const tt=document.title;document.title='Factura '+($('fNum').value||'');window.print();document.title=tt};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
