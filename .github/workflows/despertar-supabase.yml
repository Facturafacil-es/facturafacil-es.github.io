name: Mantener Supabase despierto
on:
  schedule:
    - cron: '17 6 */2 * *'   # cada 2 días
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://iyhqopatmfnslnfsjdgq.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_tXQ1D8XkIwPdc6-2fKaukg_T5Td1W7b" \
            -H "Content-Type: application/json" -d '{}')
          echo "Respuesta: $code"
          test "$code" = "200"
